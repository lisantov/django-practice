{% extends "../base_general.html" %}

{% block title %}Админ: категории{% endblock %}

{% block content %}
    <div>
        <h1>Все категории</h1>
    </div>

    <ul class="card-grid">
      {% for category in categories_list %}
        <li class="card">
            <div class="card-title">
                <h2>{{ category.name }}</h2>
            </div>
            <a href="{% url 'delete_category' category.id %}" class="delete">
                {% load static %}
                <img src="{% static 'icons/delete.svg' %}" alt="Иконка удаления">
            </a>
        </li>
      {% endfor %}
        <li class="card add">
            <a href="{% url 'create_category' %}" class="card-title">
                <h2>Добавить категорию</h2>
            </a>
        </li>
    </ul>
{% endblock %}
