{% extends "../base_general.html" %}

{% block title %}Подтверждение удаленя{% endblock %}

{% block content %}
<div>
  <h1>Удаление категории: {{ object }}</h1>
  <p class="error">При удалении категории все связанные объявления удаляться тоже!</p>
</div>

<p>Вы уверены, что хотите удалить заявку?</p>

<form class="form" method="POST">
  {% csrf_token %}
  <input class="submit-button" type="submit" value="Да, удалить">
</form>
{% endblock %}
