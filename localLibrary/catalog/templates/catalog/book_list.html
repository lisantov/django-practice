{% extends "./base/base_generic.html" %}

{% block title %}Книги{% endblock %}

{% block content %}
  <h1>Список книг</h1>
  {% if book_list %}
    <ul>
      {% for book in book_list %}
      <li>
        <a href="{{ book.get_absolute_url }}">{{ book.title }}</a>
        ({{book.author}})
      </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>На данный момент книг нету.</p>
  {% endif %}
{% endblock %}
